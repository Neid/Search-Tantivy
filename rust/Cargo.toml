[package]
name = "search_tantivy"
version = "0.1.0"
edition = "2024"
description = "C ABI over tantivy for the Perl module Search::Tantivy"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tantivy = "0.27"

[profile.release]
lto = "thin"
