name: CI

on:
  push:
  pull_request:

jobs:
  rust-lint:
    name: Rust fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --check
        working-directory: rust
      - run: cargo clippy --release -- -D warnings
        working-directory: rust

  test:
    name: Perl ${{ matrix.perl }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        perl: ["5.40", "5.26"]
        include:
          - { os: windows-latest, perl: "5.40" }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}
          distribution: ${{ runner.os == 'Windows' && 'strawberry' || 'default' }}
          install-modules-with: cpanm
          install-modules: FFI::Platypus Test2::V0
      - if: runner.os != 'Windows'
        run: perl Makefile.PL && make && make test
      # cmd, not bash: Git for Windows' bash puts its own perl first on PATH
      - if: runner.os == 'Windows'
        shell: cmd
        run: |
          perl Makefile.PL || exit /b 1
          gmake || exit /b 1
          gmake test || exit /b 1
